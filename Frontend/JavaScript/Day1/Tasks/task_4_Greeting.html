<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body class="container my-5 text-end dir-rtl">

<input placeholder="Enter your name" type="text" class="form-control" id="name"><br><br>
<button class="btn btn-success" onclick="ShowPersonalizedGreeting()">Greet with Name</button>
<div class="form-control align-items-start" id="greetingOutput"></div>

<script>
    const hour = new Date().getHours();

function ShowHour(){
    if(hour >= 0 && hour < 12){
        document.write("<h1>Good Morning</h1>");
    }
    else if(hour >= 12 && hour < 18){
        document.write("<h1>Good Afternoon</h1>");
    }
    else if(hour >= 18 && hour < 24){
        document.write("<h1>Good Evening</h1>");
    }
    else{
        document.write("<h1>Invalid hour entered.</h1>");
    }
}

function ShowPersonalizedGreeting(){
    const name = document.getElementById("name").value;
    if(hour >= 0 && hour < 12){
        document.getElementById("greetingOutput").innerHTML = `<h1>Good Morning, ${name}!</h1>`;
    }
    else if(hour >= 12 && hour < 18){
        document.getElementById("greetingOutput").innerHTML = `<h1>Good Afternoon, ${name}!</h1>`;
    }
    else if(hour >= 18 && hour < 24){
        document.getElementById("greetingOutput").innerHTML = `<h1>Good Evening, ${name}!</h1>`;
    }
    else{
        document.getElementById("greetingOutput").innerHTML = "<h1>Invalid hour entered.</h1>";
    }
}
</script>
    
</body>
</html>
