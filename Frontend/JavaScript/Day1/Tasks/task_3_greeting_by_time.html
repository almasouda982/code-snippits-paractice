<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>



<label for="hour" >Enter the current hour (0-23):</label>
<input type="number" id="hour" min="0" max="23"><br><br>
<button onclick="ShowHour()">Greet</button>

<script>
    const hour = new Date().getHours();
function ShowHour(){
    if(hour >= 0 && hour < 12){
        document.write("<h1>Good Morning!</h1>");
    }
    else if(hour >= 12 && hour < 18){
        document.write("<h1>Good Afternoon!</h1>");
    }
    else if(hour >= 18 && hour < 24){
        document.write("<h1>Good Evening!</h1>");
    }
    else{
        document.write("<h1>Invalid hour entered.</h1>");
    }
}
</script>
    
</body>
</html>
