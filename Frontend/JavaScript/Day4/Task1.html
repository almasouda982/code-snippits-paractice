        <div class="mb-3">

    <button id="btn"  class="btn btn-primary">Compute Grade</button>

  <script>
    document.getElementById("btn").onclick = function () {
      var name = document.getElementById("name").value;
      var mark= Number(document.getElementById("mark").value);
      var fullMark= Number(document.getElementById("fullMark").value);

      var PCT = (mark / fullMark) * 100;
      var band;
      if (PCT >= 85) band = "High Grade";
      else if (PCT >= 75) band = "very Good Grade";
      else if (PCT >= 65) band = "Good grade";
      else if (PCT >= 50) band = "You Passed";
      else band = "Bad Grade";

      var out = document.getElementById("out");
      out.classList.remove("d-none");
      out.innerHTML = `
      <tr>
      <th>Name</th>
      <th>Mark</th>
      <th>Full Mark</th>
      <th>Result</th>
      </tr>
    <tr>
      <tr>${name}</tr>
      <tr>${mark}</tr>
      <tr>${fullMark}</tr>
      <tr>${band}</tr>
      </tr>
    };
    `
    }
