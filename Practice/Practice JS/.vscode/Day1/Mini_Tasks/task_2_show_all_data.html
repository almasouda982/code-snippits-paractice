<!DOCTYPE html>
<html lang="en">
<head>
    <!--Input for name, age, and email – all values shown together.-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        body {
            font-family: dark;
            padding: 30px;
        }
        
        .output {
            margin-top: 20px;
            padding: 10px;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
    </style>




</head>
    <label for="nameinput">Enter your name</label>
    <input id="nameinput"><br><br>
    
    <label for="ageinput">Enter your age</label>
    <input id="ageinput"><br><br>
    
    <lable for="emailinput">Enter your email</lable>
    <input id="emailinput" type="email"><br><br>
    
    
    <button id="outputbtn">Print All</button>
    <div id="output" class="output"></div>

    
     <script>
        function Nameinput()
        {
            var name = document.getElementById("nameinput").value;
            document.getElementById("output").innerText += `your name is ${name} |`
        }

        function Ageinput()
        {
            var age = document.getElementById("ageinput").value;
            document.getElementById("output").innerText += `your age is ${age} |`
        }

        function Emailinput()
        {

            var email = document.getElementById("emailinput").value
            document.getElementById("output").innerText += `your email is ${email} |`

        }

        document.getElementById("outputbtn").addEventListener("click", () =>{
            document.getElementById("output").innerText = ""
            Nameinput();
            Ageinput();
            Emailinput();


        });





     </script>


</body>
</html>
