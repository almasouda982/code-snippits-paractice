<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اليوم الأول - المتغيرات وDOM</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }
        
        .output {
            margin-top: 20px;
            padding: 10px;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <label for="ageinput">Whats your age?</label>
    <input id="ageinput" placeholder="18">
    <button onclick="showAge()">Show Age</button>
    <div id="output" class="output"></div>

    <script>

        function showAge()
        {
            var age = document.getElementById("ageinput").value;
            var print = "";

            if (age >= 18){

                print = `you are ${age}`
            }
            else if (age >= 0)
            {
                print = `your age is ${age} underage`
            }
            else
            {
                print = `invalid input`
            }

            document.getElementById("output").innerText = print;


        }



    </script>


</body>
</html>
