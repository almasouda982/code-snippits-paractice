<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JS text</h2>
    <p>JS can change HTML attribute values</p>
    <p>In this case js changes image</p>
    <img id="myImage" src="pic_bulboff.gif" style="width:100px;">
    <button onclick="document.getElementById('myImage').src='pic_bulbon.gif'">Turn the light on</button>
    <button onclick="document.getElementById('myImage').src='pic_bulboff.gif'">Turn the light off</button>
</body>
</html>
