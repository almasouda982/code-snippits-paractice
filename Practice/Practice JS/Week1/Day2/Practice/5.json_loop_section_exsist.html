<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Task 8: Loop Over JSON and Insert into Existing Section</h2>
  <section id="teamSelection"></section>

  <script>
        const team = [
      { name: "Ali", job: "Developer", city: "Riyadh" },
      { name: "Sara", job: "Designer", city: "Jeddah" },
      { name: "Omar", job: "Manager", city: "Dammam" },
      { name: "Lina", job: "Engineer", city: "Makkah" }
    ];

    const section = document.getElementById("teamSelection");

    team.forEach(team => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `

            <h3>${team.name}</h3>
            <p>${team.job}</p>
            <p>${team.city}</p>
        
        `

        section.appendChild(card);

    });
  </script>
    
</body>
</html>
