<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.4s, color 0.4;
            padding: 20px;
        }
        .dark-mode {
            background-color: #121212;
            color: #f2f2f2;
        }
        .light-mode {
            background-color: #f2f2f2;
            color: #000000;
        }

        button{
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 10px;
        }

    </style>
</head>
<body class="light-mode">


    <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sint, similique impedit ut omnis alias illum ducimus nostrum corporis architecto. Labore ratione quaerat nemo nesciunt sit fuga amet quos iste accusantium!</h1>

    <button id="btn">change mode</button>
    <button onclick="light()">light mode</button>
    <button onclick="dark()">dark mode</button>

    


    <script>

        function changemode()
       {
        document.body.classList.toggle("light-mode")
        document.body.classList.toggle("dark-mode")
        
       }
        function dark()
       {
        document.body.classList.remove("light-mode")
        document.body.classList.add("dark-mode")
        
       }

       function light()
       {
        document.body.classList.remove("dark-mode")
        document.body.classList.add("light-mode")
       }

       document.getElementById("btn").addEventListener("click", () =>{

        changemode();

       });



    </script>
    
    
</body>
</html>
