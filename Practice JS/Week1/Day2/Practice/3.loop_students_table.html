<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }

    

  </style>
</head>
<body>
<table id="Stable">
<thead>
<tr>
  <th>name</th>
  <th>age</th>
  <th>grade</th>
</tr>
</thead>
<tbody>

</tbody>
</table>

<script>

    const students = [
        { name: "Sara", age: 20, grade: "A" },
        { name: "Ali", age: 22, grade: "B+" },
        { name: "Lina", age: 19, grade: "A-" },
        { name: "Omar", age: 21, grade: "B" }
    ];

    const tablebod = document.querySelector("#Stable tbody")

    for (let i = 0; i < students.length; i++)
    {

      let row = document.createElement("tr")

      row.innerHTML = `
      
      <td>${students[i].name}</td>
      
      <td>${students[i].age}</td>
      
      <td>${students[i].grade}</td>
      

      `
      tablebod.appendChild(row)


    }




</script>
    
</body>
</html>
