<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Documents</title>
</head>
<body>

    <section class="p-4">
        <h1 class="mb-4 text-center">Products List</h1>
        <div id="productSection" class="row g-4"></div>
    </section>

    <script>
        async function loadProducts(){
            const response = await fetch('https://fakestoreapi.com/products');
            const products = await response.json();

            const section = document.querySelector("#productSection");
            
            products.forEach(product => {
                const column = document.createElement("div");
                column.className = "col-md-3";
                
                column.innerHTML = `
                    <div class="card h-100 shadow-sm p-3">
                        <img src="${product.image}" class="card-img-top object-fit-contain" style="height: 200px;" alt="${product.title}">
                        <div class="card-body d-flex flex-column justify-content-between p-0 mt-3">
                        <h5 class="card-title fs-6 text-truncate">${product.title}</h5>
                        <p class="card-text fw-bold text-success mb-0">$${product.price}</p>
                        </div>
                    </div>
                `;
                
                section.appendChild(column);
            });
        }
        
        loadProducts();
    </script>
</body>
</html>
